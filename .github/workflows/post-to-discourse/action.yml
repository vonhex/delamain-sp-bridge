name: 'Post to Discourse'
description: 'Posts a message to a Discourse topic (existing or new)'

inputs:
  discourse-url:
    description: 'Discourse instance URL (e.g., https://discourse.example.com)'
    required: true
  api-key:
    description: 'Discourse API key'
    required: true
  api-username:
    description: 'Discourse API username (defaults to system)'
    required: false
    default: 'system'
  topic-id:
    description: 'Discourse topic ID to post to (use this OR category-id + title)'
    required: false
    default: ''
  category-id:
    description: 'Category ID for new topic (required if topic-id not provided)'
    required: false
    default: ''
  title:
    description: 'Title for new topic (required if topic-id not provided)'
    required: false
    default: ''
  message:
    description: 'Message content (markdown supported)'
    required: true

outputs:
  post-number:
    description: 'The post number in the topic'
    value: ${{ steps.post.outputs.post_number }}
  post-url:
    description: 'Direct URL to the post'
    value: ${{ steps.post.outputs.post_url }}
  topic-id:
    description: 'The topic ID (useful when creating a new topic)'
    value: ${{ steps.post.outputs.topic_id }}

runs:
  using: "composite"
  steps:
    - name: Post to Discourse
      id: post
      shell: bash
      run: |
        TOPIC_ID="${{ inputs.topic-id }}"
        CATEGORY_ID="${{ inputs.category-id }}"
        TITLE="${{ inputs.title }}"

        # Validate: need topic-id OR (category-id AND title)
        if [ -z "$TOPIC_ID" ] && { [ -z "$CATEGORY_ID" ] || [ -z "$TITLE" ]; }; then
          echo "❌ Error: Must provide either topic-id OR both category-id and title"
          echo "  topic-id='$TOPIC_ID'  category-id='$CATEGORY_ID'  title='$TITLE'"
          exit 1
        fi

        if [ -n "$TOPIC_ID" ] && { [ -n "$CATEGORY_ID" ] || [ -n "$TITLE" ]; }; then
          echo "⚠️  Warning: Both topic-id and category-id/title provided. Will post to existing topic."
        fi

        if [ -n "$TOPIC_ID" ]; then
          echo "📝 Posting to existing topic ID: $TOPIC_ID"
          PAYLOAD=$(jq -n \
            --arg raw "${{ inputs.message }}" \
            --arg topic_id "$TOPIC_ID" \
            '{topic_id: ($topic_id | tonumber), raw: $raw}')
        else
          echo "✨ Creating new topic: $TITLE"
          PAYLOAD=$(jq -n \
            --arg raw "${{ inputs.message }}" \
            --arg title "$TITLE" \
            --arg category "$CATEGORY_ID" \
            '{title: $title, category: ($category | tonumber), raw: $raw}')
        fi

        RESPONSE=$(curl -s -w "\n%{http_code}" \
          -X POST "${{ inputs.discourse-url }}/posts.json" \
          -H "Content-Type: application/json" \
          -H "Api-Key: ${{ inputs.api-key }}" \
          -H "Api-Username: ${{ inputs.api-username }}" \
          -d "$PAYLOAD")

        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
          echo "✅ Successfully posted to Discourse!"

          POST_NUMBER=$(echo "$BODY" | jq -r '.post_number // "unknown"')
          RETURNED_TOPIC=$(echo "$BODY" | jq -r '.topic_id // empty')
          FINAL_TOPIC="${RETURNED_TOPIC:-$TOPIC_ID}"
          POST_URL="${{ inputs.discourse-url }}/t/${FINAL_TOPIC}/${POST_NUMBER}"

          echo "post_number=${POST_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "post_url=${POST_URL}" >> "$GITHUB_OUTPUT"
          echo "topic_id=${FINAL_TOPIC}" >> "$GITHUB_OUTPUT"

          echo "Topic ID: ${FINAL_TOPIC}"
          echo "Post number: ${POST_NUMBER}"
          echo "URL: ${POST_URL}"
        else
          echo "❌ Failed to post to Discourse"
          echo "HTTP Code: ${HTTP_CODE}"
          echo "Response: ${BODY}"
          exit 1
        fi
