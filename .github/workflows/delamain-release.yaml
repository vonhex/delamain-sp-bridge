name: Delamain Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: delamain-release
  cancel-in-progress: true

jobs:
  strip-and-publish:
    name: Build stripped release branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and push stripped release
        env:
          BRANCH: delamain-release
        run: |
          chmod +x release/build_stripped.sh release/release_files.py
          release/build_stripped.sh

      - name: Summary
        run: |
          echo "### Release published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`delamain-release\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Install on comma 4:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cd /data && rm -rf openpilot" >> $GITHUB_STEP_SUMMARY
          echo "git clone -b delamain-release https://github.com/${{ github.repository }} openpilot" >> $GITHUB_STEP_SUMMARY
          echo "pip3 install websocket-client" >> $GITHUB_STEP_SUMMARY
          echo "sudo reboot" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
